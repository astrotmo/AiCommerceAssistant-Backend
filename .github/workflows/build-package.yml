name: Build & Package

on:
  push:
    branches: [stage]
    tags: ['v[0-9]*']
    paths:
      - '*.py'
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/**'
      - '.github/workflows/build-package.yml'
  pull_request:
    paths:
      - '*.py'
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/**'
      - '.github/workflows/build-package.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Retain the runtime source bundle as an Actions artifact (no publication)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Offline syntax, metadata and service authentication checks
        run: uv run --frozen --no-dev python scripts/check.py
      - name: Package runtime sources without secrets or local environments
        run: uv run --frozen --no-dev python scripts/package.py
      - name: Test container build (no push, no running services)
        run: docker build --tag aica-backend:ci .
      - name: Retain explicitly requested package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.package)
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
